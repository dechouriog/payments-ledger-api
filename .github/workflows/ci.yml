name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Tests unitarios y de integración (Testcontainers)
        run: mvn -B verify
